name: Probar lectura de Kobo (solo lectura, sin Monday)

on:
  workflow_dispatch: {}

jobs:
  probar-kobo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer submissions de Kobo (sin mostrar datos sensibles)
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
        run: |
          cd src
          python probar_lectura_kobo.py
