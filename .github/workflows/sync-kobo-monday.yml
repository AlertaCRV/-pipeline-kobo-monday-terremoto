name: Sincronización Kobo -> Monday

on:
  schedule:
    - cron: "0 10 * * *"   # 06:00 hora Venezuela (UTC-4), todos los días
  workflow_dispatch: {}     # permite correrlo manualmente desde GitHub

permissions:
  contents: write   # necesario para guardar ultimo_id_sincronizado.txt y docs/index.html

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sincronización
        env:
          DRY_RUN: "false"
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
        run: |
          cd src
          python sync.py

      - name: Generar página de visualización
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
        run: |
          cd src
          python generar_grafico.py

      - name: Guardar cambios (control de IDs y página generada)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimo_id_sincronizado.txt docs/index.html
          git diff --staged --quiet || git commit -m "Actualiza sincronización y página de visualización [skip ci]"
          git push
